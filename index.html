<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Trip Bingo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --cream:    #FAF7F2;
  --ink:      #1C1917;
  --muted:    #78716C;
  --border:   #E7E3DC;
  --white:    #FFFFFF;
  --accent:   #DC2626;
  --accent2:  #991B1B;
  --cell-bg:  #FFF5F5;
  --cols: 3;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--cream);
  font-family: 'Nunito', sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
}

/* ── LAYOUT ── */
.app {
  max-width: 700px;
  margin: 0 auto;
  padding: 20px 14px 48px;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.header-left { display: flex; flex-direction: column; gap: 1px; }
.header-title {
  font-family: 'Baloo 2', cursive;
  font-size: 1.55rem;
  font-weight: 800;
  line-height: 1;
  color: var(--ink);
}
.header-title span { color: var(--accent); }
.header-cat {
  font-size: .75rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .3px;
}
.settings-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--white);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  transition: border-color .15s;
  flex-shrink: 0;
}
.settings-btn:hover { border-color: var(--accent); }

/* ── WIN BANNER ── */
.win-banner {
  display: none;
  background: #FFFBEB;
  border: 2.5px solid #FCD34D;
  border-radius: 14px;
  padding: 12px 18px;
  text-align: center;
  margin-bottom: 14px;
}
.win-banner.show { display: block; }
.win-title {
  font-family: 'Baloo 2', cursive;
  font-weight: 800;
  font-size: 1.35rem;
  color: #92400E;
}
.win-sub { font-size: .8rem; color: #B45309; margin-top: 1px; }

/* ── SCORE ROW ── */
.score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 12px;
}
.score-label {
  font-family: 'Baloo 2', cursive;
  font-weight: 700;
  font-size: .85rem;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}
/* Pip grid — always square: we'll size it via JS to cols × rows */
.pip-grid {
  display: grid;
  gap: 4px;
  flex: 1;
  justify-content: flex-end;
}
.pip {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--border);
  transition: background .18s;
}
.pip.lit { background: var(--accent); }

/* ── BOARD ── */
.board-wrap {
  background: var(--white);
  border-radius: 20px;
  padding: 10px;
  border: 2px solid var(--border);
  box-shadow: 0 2px 0 var(--border);
  margin-bottom: 14px;
}
.board {
  display: grid;
  gap: 7px;
  grid-template-columns: repeat(var(--cols), 1fr);
}

/* ── CELL ── */
.cell {
  aspect-ratio: 1;
  border-radius: 12px;
  background: var(--cell-bg);
  border: 1.5px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform .12s, border-color .15s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  padding: 8% 5% 5%;
  gap: 5%;
}
.cell:hover  { transform: scale(1.04); border-color: var(--accent); }
.cell:active { transform: scale(.95); }

.cell-img {
  width: 52%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.cell-img img {
  width: 100%; height: 100%;
  object-fit: contain; display: block;
}
.cell-img .em {
  /* scales with cell size via vw-based calc */
  font-size: clamp(1.4rem, calc(var(--cols) * 1.8vw + .5rem), 3rem);
  line-height: 1;
}
.cell-name {
  font-family: 'Baloo 2', cursive;
  font-weight: 700;
  font-size: clamp(.5rem, calc(3vw / var(--cols) + .3rem), .95rem);
  color: var(--ink);
  text-align: center;
  line-height: 1.1;
}

/* FREE cell */
.cell.is-free {
  background: #FFFBEB;
  border-color: #FCD34D;
  cursor: default;
}
.cell.is-free:hover { transform: none; }
.cell.is-free .cell-name { color: #92400E; font-weight: 800; }

/* Stamped */
.cell.is-stamped { background: #FFF1F2; border-color: #FCA5A5; }
.cell.is-stamped .cell-img { opacity: .2; }
.stamp-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.stamp-circle {
  width: 68%; height: 68%;
  border-radius: 50%;
  border: 3px solid #EF4444;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: scale(.3) rotate(-30deg);
}
.is-stamped .stamp-circle {
  opacity: .88;
  animation: stamp-in .22s cubic-bezier(.175,.885,.32,1.275) forwards;
}
.stamp-mark {
  font-family: 'Baloo 2', cursive;
  font-size: clamp(.7rem, 3vw, 1.2rem);
  font-weight: 800;
  color: #EF4444;
}
@keyframes stamp-in {
  to { opacity: .88; transform: scale(1) rotate(-6deg); }
}
.cell.is-winner { animation: win-pulse .6s ease-in-out 3; }
@keyframes win-pulse {
  0%,100% { box-shadow: none; }
  50%     { box-shadow: 0 0 0 3px #FCD34D, 0 0 0 6px #F97316; }
}

/* ── CONTROLS ── */
.controls {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.btn {
  flex: 1;
  font-family: 'Baloo 2', cursive;
  font-weight: 700;
  font-size: .92rem;
  padding: 11px 8px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  transition: opacity .12s, transform .1s;
  letter-spacing: .2px;
}
.btn:active { transform: scale(.97); }
.btn-new   { background: var(--accent); color: var(--white); }
.btn-clear { background: var(--white); color: var(--ink); border: 2px solid var(--border); }
.btn-print { background: var(--white); color: var(--ink); border: 2px solid var(--border); }

/* ── SETTINGS SHEET ── */
.settings-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(28,25,23,.48);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.settings-overlay.open { display: flex; }
.settings-sheet {
  background: var(--cream);
  border-radius: 20px 20px 0 0;
  width: 100%; max-width: 700px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 16px 18px 48px;
  animation: slide-up .22s ease;
}
@keyframes slide-up {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.sheet-handle {
  width: 34px; height: 4px;
  background: var(--border);
  border-radius: 99px;
  margin: 0 auto 16px;
}
.sheet-title {
  font-family: 'Baloo 2', cursive;
  font-weight: 800;
  font-size: 1.1rem;
  margin-bottom: 16px;
}
.sheet-section { margin-bottom: 20px; }
.section-label {
  font-size: .7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--muted);
  margin-bottom: 9px;
}

/* Cat grid in settings */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}
.cat-tile {
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 9px 6px;
  background: var(--white);
  cursor: pointer;
  text-align: center;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: .76rem;
  color: var(--muted);
  transition: all .15s;
}
.cat-tile-emoji { font-size: 1.4rem; display: block; margin-bottom: 2px; }
.cat-tile:hover  { border-color: var(--accent); color: var(--accent); }
.cat-tile.active { border-color: var(--accent); background: var(--cell-bg); color: var(--accent); }

/* Item list */
.item-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 9px; }
.item-row  { display: grid; gap: 6px; align-items: center; }
.favicon-row { grid-template-columns: 1fr 1fr auto; }
.emoji-row   { grid-template-columns: 42px 1fr auto; }
.item-input {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: .84rem;
  padding: 7px 10px;
  border: 2px solid var(--border);
  border-radius: 8px;
  outline: none; width: 100%;
  background: var(--white);
  color: var(--ink);
  transition: border-color .15s;
}
.item-input:focus { border-color: var(--accent); }
.emoji-input { text-align: center; font-size: 1.1rem; padding: 5px 3px; }
.del-btn {
  width: 28px; height: 28px;
  border: none; border-radius: 7px;
  background: #FEE2E2; color: #EF4444;
  font-size: .85rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.del-btn:hover { background: #FECACA; }
.add-row-btn {
  width: 100%;
  background: var(--cream);
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 8px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: .8rem;
  color: var(--muted);
  cursor: pointer;
  transition: border-color .15s, color .15s;
  margin-bottom: 4px;
}
.add-row-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Loading */
.loading-wrap { margin-bottom: 10px; display: none; }
.loading-wrap.show { display: block; }
.loading-track {
  height: 4px; background: var(--border);
  border-radius: 99px; overflow: hidden; margin-bottom: 6px;
}
.loading-fill {
  height: 100%; border-radius: 99px;
  background: var(--accent); width: 0%;
  transition: width .3s;
}
.loading-text {
  font-size: .73rem; font-weight: 700;
  color: var(--muted); text-align: center;
}

.count-hint {
  font-size: .73rem; font-weight: 700;
  color: var(--muted); margin-bottom: 10px;
}
.count-hint.warn { color: #EF4444; }

.apply-btn {
  width: 100%;
  font-family: 'Baloo 2', cursive;
  font-weight: 700; font-size: 1rem;
  padding: 13px;
  background: var(--accent); color: var(--white);
  border: none; border-radius: 10px;
  cursor: pointer; letter-spacing: .2px;
  transition: opacity .15s;
}
.apply-btn:disabled { opacity: .45; cursor: default; }

/* ── CONFETTI ── */
.confetti-piece {
  position: fixed; top: -12px; pointer-events: none;
  border-radius: 3px;
  animation: confetti-fall linear forwards;
  z-index: 300;
}
@keyframes confetti-fall {
  0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(108vh) rotate(540deg); opacity: 0; }
}

/* ── PRINT ── */
@media print {
  body { background: white; }
  .header, .score-row, .win-banner,
  .controls, .settings-overlay, .confetti-piece { display: none !important; }
  .app { padding: 0; max-width: 100%; }
  .board-wrap { border: none; box-shadow: none; padding: 4px; border-radius: 0; }
  .board { gap: 4px; }
  .cell { border-radius: 8px; border: 1.5px solid #E7E3DC; }
  .cell:hover { transform: none; }
  .cell-name { font-size: 7pt; }
  .is-stamped { background: white !important; border-color: #E7E3DC !important; }
  .is-stamped .cell-img { opacity: 1 !important; }
  .stamp-overlay { display: none !important; }
}
</style>
</head>

<div class="app">

  <div class="header">

      <div class="header-title">Road Trip <span>Bingo</span></div>
      <div class="header-cat" id="headerCat"></div>
    </div>
    <button class="settings-btn" onclick="openSettings()" title="Settings">&#x2699;&#xFE0F;</button>
  </div>

  <div class="win-banner" id="winBanner">
    <div class="win-title">&#x1F389; BINGO!</div>

  </div>

  <div class="score-row">
    <div class="score-label" id="scoreLabel">0 found</div>

  <div class="board-wrap">
    <div class="board" id="board"></div>

  <div class="controls">

    <button class="btn btn-clear" onclick="clearStamps()">&#x21BA; Clear</button>
    <button class="btn btn-print" onclick="window.print()">&#x1F5A8; Print</button>
  </div>

</div>

<!-- Settings sheet -->
<div class="settings-overlay" id="settingsOverlay" onclick="maybeClose(event)">
  <div class="settings-sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-section">
      <div class="section-label">Category</div>
      <div class="cat-grid" id="catGrid"></div>
    </div>

    <div class="sheet-section">
      <div class="section-label">Items</div>
      <div class="count-hint" id="countHint"></div>
      <div class="item-list" id="itemList"></div>
      <button class="add-row-btn" onclick="addItem()">+ Add item</button>
    </div>

    <div class="loading-wrap" id="loadingWrap">
      <div class="loading-track"><div class="loading-fill" id="loadingFill"></div></div>
      <div class="loading-text" id="loadingText"></div>
    </div>

    <button class="apply-btn" id="applyBtn" onclick="applyAndClose()">Apply &amp; Shuffle</button>
  </div>
</div>

      {"v":"\uD83C\uDF3E","n":"Farmland"},{"v":"\u26F0\uFE0F","n":"Mountain"},
      {"v":"\uD83C\uDFD7\uFE0F","n":"Construction"},{"v":"\uD83D\uDE9C","n":"Semi Truck"},
      {"v":"\uD83C\uDFD9\uFE0F","n":"Skyline"},{"v":"\uD83D\uDEAA","n":"Exit Sign"},
      {"v":"\uD83D\uDC2E","n":"Cow Field"},{"v":"\uD83D\uDD26","n":"Tunnel"}
    ]
  },
  {
    "id":"custom","label":"Custom","emoji":"\u270F\uFE0F",
    "type":"emoji","accent":"#0891B2","accent2":"#0E7490","cellBg":"#ECFEFF",
    "items":[
      {"v":"\uD83C\uDF1F","n":"Item 1"},
      {"v":"\uD83C\uDF88","n":"Item 2"},
      {"v":"\uD83C\uDF08","n":"Item 3"}
    ]
  }
]
</script>

<script>
// ── STATE ──────────────────────────────────────────────
var CATS       = JSON.parse(document.getElementById('catData').textContent);
var activeCat  = CATS[0];
var editItems  = [];
var boardItems = [];   // resolved [{n, type:'img'|'emoji', src}]
var board      = [];   // COLS*ROWS slots, free = null
var stamped    = new Set();
var logoCache  = {};
var COLS       = 3;    // set by calcLayout()
var ROWS       = 6;
var TOTAL      = COLS * ROWS; // cells on board (one is FREE)

// ── LAYOUT DETECTION ──────────────────────────────────
function calcLayout() {
  var w = window.innerWidth;
  if (w >= 640)      { COLS = 5; ROWS = 5; }
  else if (w >= 420) { COLS = 4; ROWS = 6; }
  else               { COLS = 3; ROWS = 6; }
  TOTAL = COLS * ROWS;
  document.documentElement.style.setProperty('--cols', COLS);
}

// ── THEME ──────────────────────────────────────────────
function applyTheme(cat) {
  document.documentElement.style.setProperty('--accent',  cat.accent);
  document.documentElement.style.setProperty('--accent2', cat.accent2);
  document.documentElement.style.setProperty('--cell-bg', cat.cellBg);
}

// ── BOOT ──────────────────────────────────────────────
calcLayout();
applyTheme(activeCat);
document.getElementById('headerCat').textContent = activeCat.emoji + ' ' + activeCat.label;
buildCatGrid();
loadAndRender();

window.addEventListener('resize', function() {
  var prev = COLS;
  calcLayout();
  if (COLS !== prev) loadAndRender();
});

// ── LOAD + RESOLVE ITEMS ──────────────────────────────
async function loadAndRender() {
  var cat = activeCat;
  stamped = new Set();
  document.getElementById('winBanner').classList.remove('show');

  var resolved = [];
  if (cat.type === 'favicon') {
    for (var i = 0; i < cat.items.length; i++) {
      var item = cat.items[i];
      if (logoCache[item.v] === undefined) {
        logoCache[item.v] = await fetchFavicon(item.v);
      }
      resolved.push({n: item.n, type: 'img', src: logoCache[item.v] || ''});
    }
  } else {
    cat.items.forEach(function(item) {
      resolved.push({n: item.n, type: 'emoji', src: item.v});
    });
  }

  boardItems = resolved;
  dealBoard();
}

// ── DEAL BOARD ────────────────────────────────────────
function dealBoard() {
  stamped = new Set();
  document.getElementById('winBanner').classList.remove('show');
  var needed = TOTAL - 1; // one slot is FREE
  var pool = shuffle(boardItems).slice(0, needed);
  var freeIdx = Math.floor(TOTAL / 2); // center-ish free space
  board = [];
  var poolIdx = 0;
  for (var i = 0; i < TOTAL; i++) {
    if (i === freeIdx) { board.push(null); stamped.add(i); }
    else { board.push(pool[poolIdx++]); }
  }
  renderBoard();
  renderScore();
}

function newBoard()    { dealBoard(); }
function clearStamps() {
  var freeIdx = board.indexOf(null);
  stamped = new Set([freeIdx]);
  document.getElementById('winBanner').classList.remove('show');
  renderBoard();
  renderScore();
}

// ── RENDER BOARD ──────────────────────────────────────
function renderBoard() {
  var el = document.getElementById('board');
  el.innerHTML = '';
  board.forEach(function(item, i) {
    var cell = document.createElement('div');
    var isFree = (item === null);
    var isStamped = stamped.has(i);
    cell.className = 'cell' + (isFree ? ' is-free' : '') + (isStamped ? ' is-stamped' : '');
    cell.setAttribute('data-i', String(i));

    if (isFree) {
      cell.innerHTML =
        '<div class="cell-img"><span class="em">&#x2B50;</span></div>' +
        '<div class="cell-name">FREE!</div>';
    } else {
      var imgHtml = item.type === 'emoji'
        ? '<span class="em">' + item.src + '</span>'
        : (item.src
            ? '<img src="' + item.src + '" alt="' + eh(item.n) + '" loading="lazy">'
            : '<span style="font-size:.6rem;font-weight:800;color:#A8A29E;font-family:\'Baloo 2\',cursive;text-align:center;line-height:1.2">' + eh(item.n) + '</span>');
      var stampHtml = isStamped
        ? '<div class="stamp-overlay"><div class="stamp-circle"><span class="stamp-mark">&#x2713;</span></div></div>'
        : '';
      cell.innerHTML =
        '<div class="cell-img">' + imgHtml + '</div>' +
        '<div class="cell-name">' + eh(item.n) + '</div>' +
        stampHtml;
      cell.addEventListener('click', (function(idx) {
        return function() { tap(idx); };
      })(i));
    }
    el.appendChild(cell);
  });
}

function tap(i) {
  if (board[i] === null) return;
  if (stamped.has(i)) { stamped.delete(i); } else { stamped.add(i); }
  renderBoard();
  renderScore();
  checkWin();
}

// ── SCORE + PIPS ──────────────────────────────────────
function renderScore() {
  var freeIdx = board.indexOf(null);
  var found = stamped.size - (stamped.has(freeIdx) ? 1 : 0);
  var total = TOTAL - 1;
  document.getElementById('scoreLabel').textContent = found + ' of ' + total + ' found';

  // Pip grid: make it as square as possible
  // e.g. 17 items → 3 cols of 6 rows, or pick cols that divide evenly
  var pipCount = total;
  var pipCols  = Math.ceil(Math.sqrt(pipCount));
  // nudge to a "nice" number
  if (pipCols < 4) pipCols = 4;
  if (pipCols > 8) pipCols = 8;

  var grid = document.getElementById('pipGrid');
  grid.style.gridTemplateColumns = 'repeat(' + pipCols + ', 9px)';
  grid.innerHTML = '';

  var pipIdx = 0;
  board.forEach(function(item, i) {
    if (item === null) return; // skip FREE
    var pip = document.createElement('div');
    var lit = stamped.has(i);
    pip.className = 'pip' + (lit ? ' lit' : '');
    grid.appendChild(pip);
    pipIdx++;
  });
}

// ── WIN CHECK ─────────────────────────────────────────
function checkWin() {
  // Build lines dynamically for any COLS×ROWS grid
  var lines = [];
  // Rows
  for (var r = 0; r < ROWS; r++) {
    var row = [];
    for (var c = 0; c < COLS; c++) row.push(r * COLS + c);
    lines.push(row);
  }
  // Cols
  for (var c = 0; c < COLS; c++) {
    var col = [];
    for (var r = 0; r < ROWS; r++) col.push(r * COLS + c);
    lines.push(col);
  }
  // Diagonals (only if square)
  if (COLS === ROWS) {
    var d1 = [], d2 = [];
    for (var k = 0; k < COLS; k++) {
      d1.push(k * COLS + k);
      d2.push(k * COLS + (COLS - 1 - k));
    }
    lines.push(d1); lines.push(d2);
  }

  var won = false;
  lines.forEach(function(line) {
    if (line.every(function(i) { return stamped.has(i); })) {
      won = true;
      line.forEach(function(i) {
        var c = document.querySelector('.cell[data-i="' + i + '"]');
        if (c) { c.classList.remove('is-winner'); void c.offsetWidth; c.classList.add('is-winner'); }
      });
    }
  });
  if (won) {
    document.getElementById('winBanner').classList.add('show');
    boom();
  }
}

// ── SETTINGS ──────────────────────────────────────────
function openSettings() {
  editItems = activeCat.items.map(function(i) { return {v: i.v, n: i.n}; });
  buildCatGrid();
  renderItemList();
  document.getElementById('loadingWrap').classList.remove('show');
  document.getElementById('applyBtn').disabled = false;
  document.getElementById('settingsOverlay').classList.add('open');
}

function maybeClose(e) {
  if (e.target === document.getElementById('settingsOverlay')) closeSettings();
}
function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}

function buildCatGrid() {
  var grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CATS.forEach(function(cat) {
    var tile = document.createElement('button');
    tile.className = 'cat-tile' + (cat.id === activeCat.id ? ' active' : '');
    tile.setAttribute('data-id', cat.id);
    tile.innerHTML = '<span class="cat-tile-emoji">' + cat.emoji + '</span>' + cat.label;
    tile.onclick = function() {
      activeCat = CATS.find(function(c) { return c.id === cat.id; });
      editItems = activeCat.items.map(function(i) { return {v: i.v, n: i.n}; });
      document.querySelectorAll('.cat-tile').forEach(function(t) {
        t.classList.toggle('active', t.getAttribute('data-id') === cat.id);
      });
      renderItemList();
    };
    grid.appendChild(tile);
  });
}

function renderItemList() {
  var list = document.getElementById('itemList');
  list.innerHTML = '';
  var isFav = activeCat.type === 'favicon';
  editItems.forEach(function(item, i) {
    var row = document.createElement('div');
    row.className = 'item-row ' + (isFav ? 'favicon-row' : 'emoji-row');
    if (isFav) {
      row.innerHTML =
        '<input class="item-input" type="text" value="' + eh(item.v) + '" placeholder="domain.com" oninput="editItems[' + i + '].v=this.value">' +
        '<input class="item-input" type="text" value="' + eh(item.n) + '" placeholder="Name" oninput="editItems[' + i + '].n=this.value;updateCount()">' +
        '<button class="del-btn" onclick="deleteItem(' + i + ')">&#x2715;</button>';
    } else {
      row.innerHTML =
        '<input class="item-input emoji-input" type="text" value="' + item.v + '" maxlength="4" oninput="editItems[' + i + '].v=this.value">' +
        '<input class="item-input" type="text" value="' + eh(item.n) + '" placeholder="Name" oninput="editItems[' + i + '].n=this.value;updateCount()">' +
        '<button class="del-btn" onclick="deleteItem(' + i + ')">&#x2715;</button>';
    }
    list.appendChild(row);
  });
  updateCount();
}

function addItem() {
  var isFav = activeCat.type === 'favicon';
  editItems.push(isFav ? {v: 'example.com', n: 'New Brand'} : {v: '\u2B50', n: 'New Item'});
  renderItemList();
  setTimeout(function() {
    var inputs = document.querySelectorAll('#itemList .item-input:not(.emoji-input)');
    var last = inputs[inputs.length - 1];
    if (last) { last.focus(); last.select(); }
  }, 40);
}

function deleteItem(i) { editItems.splice(i, 1); renderItemList(); }

function updateCount() {
  var hint = document.getElementById('countHint');
  var n = editItems.length;
  var needed = TOTAL - 1;
  hint.textContent = n + ' items' + (n < needed ? ' \u2014 need ' + (needed - n) + ' more for this board size' : '');
  hint.className = 'count-hint' + (n < needed ? ' warn' : '');
}

async function applyAndClose() {
  var needed = TOTAL - 1;
  if (editItems.length < needed) {
    alert('Need at least ' + needed + ' items for this board size. Add ' + (needed - editItems.length) + ' more.');
    return;
  }
  activeCat.items = editItems.map(function(i) { return {v: i.v, n: i.n}; });

  var btn = document.getElementById('applyBtn');
  btn.disabled = true;

  var isFav = activeCat.type === 'favicon';
  if (isFav) {
    var uncached = activeCat.items.filter(function(i) { return logoCache[i.v] === undefined; });
    if (uncached.length > 0) {
      document.getElementById('loadingWrap').classList.add('show');
      for (var i = 0; i < uncached.length; i++) {
        document.getElementById('loadingFill').style.width = Math.round(((i+1)/uncached.length)*100) + '%';
        document.getElementById('loadingText').textContent = 'Fetching ' + uncached[i].n + '...';
        logoCache[uncached[i].v] = await fetchFavicon(uncached[i].v);
      }
      document.getElementById('loadingWrap').classList.remove('show');
    }
  }

  btn.disabled = false;
  applyTheme(activeCat);
  document.getElementById('headerCat').textContent = activeCat.emoji + ' ' + activeCat.label;
  closeSettings();
  await loadAndRender();
}

// ── FAVICON FETCH ─────────────────────────────────────
// DuckDuckGo first (faster, less likely to return a placeholder),
// favicon.im as fallback
async function fetchFavicon(domain) {
  var services = [
    'https://icons.duckduckgo.com/ip3/' + domain + '.ico',
    'https://favicon.im/' + domain + '?larger=true'
  ];
  for (var i = 0; i < services.length; i++) {
    try {
      var resp = await fetch(services[i]);
      if (!resp.ok) continue;
      var blob = await resp.blob();
      if (blob.size < 150) continue; // skip tiny placeholder
      var dataUrl = await blobToDataUrl(blob);
      if (dataUrl) return dataUrl;
    } catch(e) { continue; }
  }
  return null;
}

function blobToDataUrl(blob) {
  return new Promise(function(res) {
    var r = new FileReader();
    r.onload  = function() { res(r.result); };
    r.onerror = function() { res(null); };
    r.readAsDataURL(blob);
  });
}

// ── CONFETTI ──────────────────────────────────────────
function boom() {
  var colors = ['#EF4444','#F97316','#FCD34D','#22C55E','#3B82F6','#A855F7'];
  for (var i = 0; i < 55; i++) {
    var el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    var sz = (5 + Math.random() * 9) + 'px';
    el.style.width = sz; el.style.height = sz;
    el.style.animationDuration = (1.4 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 1.2) + 's';
    el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(el);
    el.addEventListener('animationend', function() { this.remove(); });
  }
}

// ── UTILS ─────────────────────────────────────────────
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function eh(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
