<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Tester (img tags)</title>
<style>
body { font-family: system-ui, sans-serif; background: #f8f8f6; color: #1c1917; padding: 20px; max-width: 900px; margin: 0 auto; }
h1 { font-size: 1.3rem; margin-bottom: 4px; }
p  { font-size: .85rem; color: #78716c; margin-bottom: 20px; }
.service-block { margin-bottom: 36px; }
.service-name {
  font-size: .75rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .8px; color: #78716c;
  margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 2px solid #e7e3dc;
  display: flex; align-items: center; gap: 10px;
}
.service-url { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: .72rem; color: #a8a29e; }
.service-status { margin-left: auto; font-size: .72rem; font-weight: 700; }
.logo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 8px;
}
.logo-cell {
  background: white;
  border: 1.5px solid #e7e3dc;
  border-radius: 10px;
  padding: 8px 6px 6px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 5px; min-height: 84px;
}
.logo-cell img {
  width: 44px; height: 44px;
  object-fit: contain; display: block;
}
.logo-cell .name {
  font-size: .62rem; font-weight: 700;
  text-align: center; color: #57534e; line-height: 1.2;
}
.run-btn {
  background: #dc2626; color: white;
  border: none; border-radius: 8px;
  padding: 10px 24px; font-size: .95rem; font-weight: 700;
  cursor: pointer; margin-bottom: 24px;
}
</style>
</head>
<body>

<h1>&#x1F50D; Logo Tester (plain &lt;img&gt; tags)</h1>
<p>This version uses plain <strong>&lt;img src&gt;</strong> tags instead of fetch() &mdash; which sidesteps the CORS restriction entirely. The browser displays the logo directly without JavaScript reading the bytes. Each service is shown below; just look at which ones display real logos.</p>

<div id="results"></div>

<script>
var BRANDS = [
  {v:'toyota.com',n:'Toyota'},{v:'honda.com',n:'Honda'},{v:'ford.com',n:'Ford'},
  {v:'chevrolet.com',n:'Chevy'},{v:'dodge.com',n:'Dodge'},{v:'jeep.com',n:'Jeep'},
  {v:'nissanusa.com',n:'Nissan'},{v:'hyundaiusa.com',n:'Hyundai'},{v:'kia.com',n:'Kia'},
  {v:'subaru.com',n:'Subaru'},{v:'bmwusa.com',n:'BMW'},{v:'tesla.com',n:'Tesla'},
  {v:'buick.com',n:'Buick'},{v:'gmc.com',n:'GMC'},{v:'mazdausa.com',n:'Mazda'},
  {v:'vw.com',n:'VW'},{v:'volvocars.com',n:'Volvo'},{v:'audiusa.com',n:'Audi'},
  {v:'lexus.com',n:'Lexus'},{v:'acura.com',n:'Acura'},{v:'mbusa.com',n:'Mercedes'},
  {v:'porsche.com',n:'Porsche'},{v:'mitsubishicars.com',n:'Mitsubishi'},{v:'lincoln.com',n:'Lincoln'},
  {v:'infinitiusa.com',n:'Infiniti'},{v:'cadillac.com',n:'Cadillac'},{v:'ramtrucks.com',n:'Ram'},
  {v:'chrysler.com',n:'Chrysler'}
];

var SERVICES = [
  {name:'Google S2 (sz=128)', url:function(d){return 'https://www.google.com/s2/favicons?sz=128&domain='+d;}},
  {name:'DuckDuckGo',         url:function(d){return 'https://icons.duckduckgo.com/ip3/'+d+'.ico';}},
  {name:'favicon.im (larger)',url:function(d){return 'https://favicon.im/'+d+'?larger=true';}},
  {name:'Icon Horse',         url:function(d){return 'https://icon.horse/icon/'+d;}},
  {name:'Clearbit',           url:function(d){return 'https://logo.clearbit.com/'+d;}}
];

var results = document.getElementById('results');
SERVICES.forEach(function(svc) {
  var block = document.createElement('div');
  block.className = 'service-block';
  var header = document.createElement('div');
  header.className = 'service-name';
  header.innerHTML = svc.name + ' <span class="service-url">' + svc.url('domain.com') + '</span>';
  block.appendChild(header);
  var grid = document.createElement('div');
  grid.className = 'logo-grid';
  BRANDS.forEach(function(brand) {
    var cell = document.createElement('div');
    cell.className = 'logo-cell';
    var img = document.createElement('img');
    img.src = svc.url(brand.v);
    img.alt = brand.n;
    img.loading = 'lazy';
    cell.appendChild(img);
    var nm = document.createElement('div');
    nm.className = 'name';
    nm.textContent = brand.n;
    cell.appendChild(nm);
    grid.appendChild(cell);
  });
  block.appendChild(grid);
  results.appendChild(block);
});
</script>
</body>
</html>
