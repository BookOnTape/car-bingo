<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Service Tester</title>
<style>
body { font-family: system-ui, sans-serif; background: #f8f8f6; color: #1c1917; padding: 20px; max-width: 900px; margin: 0 auto; }
h1 { font-size: 1.3rem; margin-bottom: 4px; }
p  { font-size: .85rem; color: #78716c; margin-bottom: 20px; }

.service-block { margin-bottom: 36px; }
.service-name {
  font-size: .75rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .8px; color: #78716c;
  margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 2px solid #e7e3dc;
  display: flex; align-items: center; gap: 10px;
}
.service-url { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: .72rem; color: #a8a29e; }
.service-status { margin-left: auto; font-size: .72rem; font-weight: 700; }
.service-status.ok   { color: #16a34a; }
.service-status.fail { color: #dc2626; }

.logo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 8px;
}
.logo-cell {
  background: white;
  border: 1.5px solid #e7e3dc;
  border-radius: 10px;
  padding: 8px 6px 6px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 5px;
  min-height: 80px;
}
.logo-cell img {
  width: 40px; height: 40px;
  object-fit: contain; display: block;
}
.logo-cell .name {
  font-size: .62rem; font-weight: 700;
  text-align: center; color: #57534e;
  line-height: 1.2;
}
.logo-cell .status {
  font-size: .55rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .4px;
}
.logo-cell.ok     { border-color: #bbf7d0; }
.logo-cell.fail   { border-color: #fecaca; background: #fff5f5; }
.logo-cell.ok   .status { color: #16a34a; }
.logo-cell.fail .status { color: #dc2626; }
.logo-cell .placeholder {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font-size: .6rem; color: #a8a29e; text-align: center;
}

.run-btn {
  background: #dc2626; color: white;
  border: none; border-radius: 8px;
  padding: 10px 24px;
  font-size: .95rem; font-weight: 700;
  cursor: pointer; margin-bottom: 24px;
}
.run-btn:disabled { background: #94a3b8; cursor: default; }
.overall { font-size: .82rem; font-weight: 700; color: #57534e; margin-bottom: 16px; }
</style>
</head>
<body>

<h1>&#x1F50D; Logo Service Tester</h1>
<p>Tests four different favicon/logo services against all 28 car brands. Green = loaded successfully, Red = failed or returned a tiny placeholder. Run this from <strong>bookontape.github.io</strong> for accurate results.</p>

<button class="run-btn" id="runBtn" onclick="runAll()">Run All Tests</button>
<div class="overall" id="overall"></div>
<div id="results"></div>

<script>
var BRANDS = [
  {v:'toyota.com',      n:'Toyota'},
  {v:'honda.com',       n:'Honda'},
  {v:'ford.com',        n:'Ford'},
  {v:'chevrolet.com',   n:'Chevy'},
  {v:'dodge.com',       n:'Dodge'},
  {v:'jeep.com',        n:'Jeep'},
  {v:'nissanusa.com',   n:'Nissan'},
  {v:'hyundaiusa.com',  n:'Hyundai'},
  {v:'kia.com',         n:'Kia'},
  {v:'subaru.com',      n:'Subaru'},
  {v:'bmwusa.com',      n:'BMW'},
  {v:'tesla.com',       n:'Tesla'},
  {v:'buick.com',       n:'Buick'},
  {v:'gmc.com',         n:'GMC'},
  {v:'mazdausa.com',    n:'Mazda'},
  {v:'vw.com',          n:'VW'},
  {v:'volvocars.com',   n:'Volvo'},
  {v:'audiusa.com',     n:'Audi'},
  {v:'lexus.com',       n:'Lexus'},
  {v:'acura.com',       n:'Acura'},
  {v:'mbusa.com',       n:'Mercedes'},
  {v:'porsche.com',     n:'Porsche'},
  {v:'mitsubishicars.com', n:'Mitsubishi'},
  {v:'lincoln.com',     n:'Lincoln'},
  {v:'infinitiusa.com', n:'Infiniti'},
  {v:'cadillac.com',    n:'Cadillac'},
  {v:'ramtrucks.com',   n:'Ram'},
  {v:'chrysler.com',    n:'Chrysler'}
];

// All services to test — add or remove as needed
var SERVICES = [
  {
    name: 'DuckDuckGo',
    url: function(d) { return 'https://icons.duckduckgo.com/ip3/' + d + '.ico'; },
    minSize: 150
  },
  {
    name: 'favicon.im',
    url: function(d) { return 'https://favicon.im/' + d + '?larger=true'; },
    minSize: 200
  },
  {
    name: 'Google S2 (sz=64)',
    url: function(d) { return 'https://www.google.com/s2/favicons?sz=64&domain=' + d; },
    minSize: 150
  },
  {
    name: 'Favicon Grabber',
    url: function(d) { return 'https://favicongrabber.com/api/grab/' + d + '?pretty=false'; },
    minSize: 0,
    isJson: true  // returns JSON with icon URLs, not an image directly
  }
];

async function fetchAndCheck(url, minSize, isJson) {
  try {
    var resp = await fetch(url, {mode: 'cors'});
    if (!resp.ok) return {ok: false, reason: 'HTTP ' + resp.status, dataUrl: null};

    if (isJson) {
      // favicongrabber returns JSON — extract first icon URL and fetch it
      var json = await resp.json();
      var icons = (json && json.icons) ? json.icons : [];
      // prefer larger icons
      icons.sort(function(a,b) { return (b.sizes||'0').localeCompare(a.sizes||'0'); });
      if (!icons.length || !icons[0].src) return {ok: false, reason: 'no icons', dataUrl: null};
      var iconResp = await fetch(icons[0].src, {mode: 'cors'});
      if (!iconResp.ok) return {ok: false, reason: 'icon fetch failed', dataUrl: null};
      var blob2 = await iconResp.blob();
      if (blob2.size < 50) return {ok: false, reason: 'too small', dataUrl: null};
      var du2 = await blobToDataUrl(blob2);
      return {ok: true, dataUrl: du2};
    }

    var blob = await resp.blob();
    if (blob.size < minSize) return {ok: false, reason: 'placeholder (' + blob.size + 'b)', dataUrl: null};
    var dataUrl = await blobToDataUrl(blob);
    return {ok: true, dataUrl: dataUrl};
  } catch(e) {
    return {ok: false, reason: e.message || 'fetch error', dataUrl: null};
  }
}

function blobToDataUrl(blob) {
  return new Promise(function(res) {
    var r = new FileReader();
    r.onload = function() { res(r.result); };
    r.onerror = function() { res(null); };
    r.readAsDataURL(blob);
  });
}

async function runAll() {
  var btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.textContent = 'Running...';
  document.getElementById('results').innerHTML = '';
  document.getElementById('overall').textContent = '';

  var summary = [];

  for (var s = 0; s < SERVICES.length; s++) {
    var svc = SERVICES[s];
    var block = document.createElement('div');
    block.className = 'service-block';
    var header = document.createElement('div');
    header.className = 'service-name';
    header.innerHTML = svc.name + ' <span class="service-url">' + svc.url('domain.com') + '</span><span class="service-status" id="svc-status-' + s + '">testing...</span>';
    block.appendChild(header);
    var grid = document.createElement('div');
    grid.className = 'logo-grid';
    block.appendChild(grid);
    document.getElementById('results').appendChild(block);

    var okCount = 0;
    for (var i = 0; i < BRANDS.length; i++) {
      var brand = BRANDS[i];
      var cell = document.createElement('div');
      cell.className = 'logo-cell';
      cell.innerHTML = '<div class="placeholder">...</div><div class="name">' + brand.n + '</div><div class="status">testing</div>';
      grid.appendChild(cell);

      var result = await fetchAndCheck(svc.url(brand.v), svc.minSize, svc.isJson);

      cell.innerHTML = '';
      if (result.ok && result.dataUrl) {
        cell.className = 'logo-cell ok';
        var img = document.createElement('img');
        img.src = result.dataUrl;
        img.alt = brand.n;
        cell.appendChild(img);
        okCount++;
      } else {
        cell.className = 'logo-cell fail';
        var ph = document.createElement('div');
        ph.className = 'placeholder';
        ph.textContent = result.reason || 'fail';
        cell.appendChild(ph);
      }
      var nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = brand.n;
      cell.appendChild(nm);
      var st = document.createElement('div');
      st.className = 'status';
      st.textContent = result.ok ? 'ok' : 'fail';
      cell.appendChild(st);
    }

    var pct = Math.round((okCount / BRANDS.length) * 100);
    var statusEl = document.getElementById('svc-status-' + s);
    statusEl.textContent = okCount + '/' + BRANDS.length + ' (' + pct + '%)';
    statusEl.className = 'service-status ' + (okCount >= BRANDS.length * .75 ? 'ok' : 'fail');
    summary.push({name: svc.name, ok: okCount, total: BRANDS.length});
  }

  // Overall summary
  var best = summary.reduce(function(a,b) { return a.ok >= b.ok ? a : b; });
  document.getElementById('overall').textContent =
    'Best service: ' + best.name + ' (' + best.ok + '/' + best.total + ' logos loaded). See results below.';

  btn.disabled = false;
  btn.textContent = 'Run Again';
}
</script>
</body>
</html>
